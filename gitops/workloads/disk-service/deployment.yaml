# ══════════════════════════════════════════════════════════════════════════════
# disk-service
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disk-service
  labels:
    app: disk-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: disk-service
  template:
    metadata:
      # This one line replaces the agent that used to be baked into the Dockerfile. The Operator
      # adds an init container, mounts the agent and sets the OTEL_* variables from the
      # Instrumentation CR named "devops-apps". The image knows nothing about OpenTelemetry.
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
      labels:
        app: disk-service
    spec:
      serviceAccountName: disk-service
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: disk-service
          image: learn-opensible-disk-service
          ports:
            - name: http
              containerPort: 4003
          env:
            # The name shown on the service map — a label change, not a code change.
            - name: OTEL_SERVICE_NAME
              value: "disk-service"
            - name: KAFKA_BROKERS
              value: "redpanda.redpanda.svc.cluster.local:9092"
            - name: METRICS_TOPIC
              value: "node-metrics"
            # Endpoint, protocol and batch delay are NOT declared here: the Instrumentation CR
            # (instrumentation.yaml) is their single home, injected by the Operator at pod creation.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The JVM starts far slower than the other three runtimes. 60 x 2s = 2 minutes, wide enough
          # for a first start on a loaded machine.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          # Triple the others: the JVM takes a substantial baseline before running a line of
          # application code. A measured cost of the runtime, not a guess.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
