# ==============================================================================
# RBAC for disk-service alone — the ONLY service that needs nodes/stats.
#
# These three services once shared one ServiceAccount, which forced the ClusterRole to be
# the UNION of every permission: cpu and memory were granted nodes/stats they never used.
#
# nodes/stats, and NEVER nodes/proxy. metrics-server reports no disk usage by design; that
# figure lives in kubelet /stats/summary. Two routes reach it, with very different rights:
#
#   1. API server proxy     /api/v1/nodes/<n>:10250/proxy/stats/summary  ->  nodes/proxy
#   2. Straight to kubelet   https://<nodeIP>:10250/stats/summary        ->  nodes/stats
#
# RBAC CANNOT restrict paths inside the proxy, so nodes/proxy also grants /exec and /run —
# arbitrary commands in any container on any node. One compromised pod becomes cluster
# control. Route 2 was verified here: metrics-server already uses nodes/metrics the same
# way, so kubelet webhook authorization is on, and curl to the kubelet with kube-root-ca.crt
# returns 401 rather than a TLS error — the serving cert is signed by the CA every pod mounts.
# ==============================================================================
#
#
# ------------------------------------------------------------------------------
#
#
#   1. Qua API server proxy   /api/v1/nodes/<n>:10250/proxy/stats/summary  → nodes/proxy
#
#     /stats/*    → nodes/stats
#     /metrics/*  → nodes/metrics
#     /logs/*     → nodes/log
#
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: disk-service
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: disk-service-reader
rules:
  # Node identity, ephemeral-storage capacity, labels, conditions, image list.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # USED capacity, read straight from kubelet /stats/summary. Opens /stats and nothing else.
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: disk-service-reader
subjects:
  - kind: ServiceAccount
    name: disk-service
    namespace: devops-apps
roleRef:
  kind: ClusterRole
  name: disk-service-reader
  apiGroup: rbac.authorization.k8s.io
