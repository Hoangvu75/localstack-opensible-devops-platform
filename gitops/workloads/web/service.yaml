apiVersion: v1
kind: Service
metadata:
  name: web-svc
  labels:
    app: web
spec:
  # ClusterIP: external traffic arrives through the Ingress. NodePort 30080 belongs to the
  # ingress-nginx controller, which is what the ALB target group points at.
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: web
