---
# Populate and rotate secrets in AWS Secrets Manager.
#
# This is the ONLY entry point where secrets are ingested into the system. All other playbooks only READ.
#
# Input: `GITHUB_TOKEN` environment variable, configured in `.env` and passed to `opensible-worker` via docker-compose.yml.
#
# ------------------------------------------------------------------------------
# `.env` is the ingestion source, not where playbooks read from
#
# Benefits:
#   - Token is no longer exposed in `start-build` command lines → not visible via worker `ps`
#   - Token is not stored in CodeBuild environment overrides alongside build history
#   - All consumers read from a single source of truth, governed by IAM permissions
#
# ==============================================================================
# Why secrets are outside OpenTofu
# ==============================================================================
#
# 1. Bootstrap loop: Playbooks require tokens to clone the repo containing `iac/`.
# 2. State file security: Using `aws_secretsmanager_secret_version` would store plaintext values in tfstate.
#
# ==============================================================================
# Trust Chain Architecture
# ==============================================================================
#
# On real AWS, IAM roles attached to compute (CodeBuild service roles, IRSA on EKS pods)
# eliminate the need for static credentials.
# The root of trust is MACHINE IDENTITY, not a secret string in a file.
- name: Manage secrets in AWS Secrets Manager
  hosts: localhost
  gather_facts: false

  vars:
    aws_endpoint: "{{ lookup('env', 'AWS_ENDPOINT') | default('http://localstack:4566', true) }}"
    aws_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('us-east-1', true) }}"
    is_local: "{{ 'true' if 'localstack' in aws_endpoint or 'localhost' in aws_endpoint else 'false' }}"

    project_name: "learn-opensible"
    # Must match local.github_token_secret_id in iac/secrets.tf and default in buildspec.yml.
    secret_id_github: "{{ project_name }}/github-token"

    token_value: "{{ lookup('env', 'GITHUB_TOKEN') | default('', true) | trim }}"

  tasks:
    - name: Fail when no token value was supplied
      ansible.builtin.fail:
        msg: >-
          Token value not found. Check the following:
          (1) .env contains GITHUB_TOKEN=ghp_...;
          (2) docker-compose.yml, opensible-worker service contains
          `- GITHUB_TOKEN=${GITHUB_TOKEN:-}`;
          (3) Ran `docker compose up -d opensible-worker` after updating .env.
      when: (token_value | length) == 0

    - name: Sanity-check the token shape
      ansible.builtin.fail:
        msg: >-
          Value does not appear to be a GitHub PAT (expected prefix ghp_ / github_pat_ / gho_).
          If this is intentional, re-run with: skip_token_shape_check: true
      when:
        - not (skip_token_shape_check | default(false) | bool)
        - not (token_value is match('^(ghp_|github_pat_|gho_)'))

    - name: Ensure CLI tooling is present
      ansible.builtin.shell: |
        set -e
        if ! command -v aws >/dev/null 2>&1; then
          curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install --update
          rm -rf /tmp/aws /tmp/awscliv2.zip
          echo installed-aws
        fi
        aws --version
      register: tooling
      changed_when: "'installed' in tooling.stdout"

    - name: Store the GitHub token in Secrets Manager
      ansible.builtin.shell: |
        set -e
        if [ "{{ is_local }}" = "true" ]; then EP="--endpoint-url {{ aws_endpoint }}"; else EP=""; fi

        OLD_UMASK=$(umask); umask 077
        TMPF=$(mktemp /tmp/.sec.XXXXXX)
        umask "$OLD_UMASK"
        trap 'rm -f "$TMPF"' EXIT
        printf '%s' '{{ token_value }}' > "$TMPF"

        if aws secretsmanager describe-secret --secret-id {{ secret_id_github }} \
             --region {{ aws_region }} $EP >/dev/null 2>&1; then
          aws secretsmanager put-secret-value --secret-id {{ secret_id_github }} \
            --secret-string "file://$TMPF" \
            --region {{ aws_region }} $EP >/dev/null
          echo "rotated"
        else
          aws secretsmanager create-secret --name {{ secret_id_github }} \
            --description "GitHub PAT (write) - playbook clone, ArgoCD repo cred, CodeBuild image tag updates" \
            --secret-string "file://$TMPF" \
            --region {{ aws_region }} $EP >/dev/null
          echo "created"
        fi
      register: store_result
      no_log: true
      changed_when: true

    - name: Verify what landed in Secrets Manager
      ansible.builtin.shell: |
        set -e
        if [ "{{ is_local }}" = "true" ]; then EP="--endpoint-url {{ aws_endpoint }}"; else EP=""; fi
        LEN=$(aws secretsmanager get-secret-value --secret-id {{ secret_id_github }} \
                --region {{ aws_region }} $EP --query SecretString --output text | tr -d '\n' | wc -c)
        VERS=$(aws secretsmanager list-secret-version-ids --secret-id {{ secret_id_github }} \
                 --region {{ aws_region }} $EP --query 'length(Versions)' --output text 2>/dev/null || echo "?")
        ARN=$(aws secretsmanager describe-secret --secret-id {{ secret_id_github }} \
                --region {{ aws_region }} $EP --query ARN --output text)
        echo "length=$LEN  version_count=$VERS"
        echo "ARN=$ARN"
      register: verify
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "Secret   : {{ secret_id_github }}"
          - "Action   : {{ 'CREATED' if 'created' in (store_result.stdout | default('')) else 'ROTATED — new version created, previous labeled AWSPREVIOUS' }}"
          - "{{ verify.stdout_lines | join(' | ') }}"
          - ""
          - "Secret value is NEVER logged — only length is shown for verification."
          - ""
          - "Playbooks read tokens from Secrets Manager directly."
          - "No worker restart required: secrets are retrieved dynamically at runtime."
          - "=========================================================="
