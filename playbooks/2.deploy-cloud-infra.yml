---
- name: Deploy S3 Stack via OpenTofu
  hosts: localhost
  gather_facts: false

  vars:
    # Read from environment variables, fallback to local LocalStack defaults
    aws_endpoint: "{{ lookup('env', 'AWS_ENDPOINT') | default('http://localstack:4566', true) }}"
    aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default('mock_access_key', true) }}"
    aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default('mock_secret_key', true) }}"
    is_local: "{{ 'true' if 'localstack' in aws_endpoint or 'localhost' in aws_endpoint else 'false' }}"
    github_repo: "github.com/Hoangvu75/learn-opensible.git"

    aws_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('us-east-1', true) }}"
    project_name: "learn-opensible"

    # GitHub token retrieved from AWS Secrets Manager (NOT from .env or hardcoded).
    # Populated by playbooks/1.manage-secrets.yml. Matches iac/secrets.tf.
    secret_id_github: "{{ project_name }}/github-token"

    # State bucket and lock table are bootstrapped outside OpenTofu and survive `tofu destroy`.
    # Must match the backend block in iac/providers.tf.
    state_bucket: "{{ project_name }}-tfstate"
    state_key: "infra/terraform.tfstate"
    state_lock_table: "{{ project_name }}-tfstate-lock"
    iac_dir: "/tmp/learn-opensible/iac"

  tasks:
    # opensible-worker container is ephemeral: ensure required CLI tools are present.
    - name: Ensure CLI tooling is present
      ansible.builtin.shell: |
        set -e
        if ! command -v aws >/dev/null 2>&1; then
          curl -sSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install --update
          rm -rf /tmp/aws /tmp/awscliv2.zip
          echo installed-aws
        fi
        if [ ! -x /usr/local/bin/kubectl ]; then
          curl -sSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.28.2/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
          echo installed-kubectl
        fi
        aws --version
        /usr/local/bin/kubectl version --client=true 2>/dev/null | head -1 || true
      register: tooling
      changed_when: "'installed' in tooling.stdout"

    # ── Retrieve git credential from AWS Secrets Manager ─────────────────────────
    - name: Read the GitHub token from Secrets Manager
      ansible.builtin.shell: |
        if [ "{{ is_local }}" = "true" ]; then EP="--endpoint-url {{ aws_endpoint }}"; else EP=""; fi
        aws secretsmanager get-secret-value --secret-id {{ secret_id_github }} \
          --region {{ aws_region }} $EP --query SecretString --output text
      register: gh_secret
      no_log: true
      changed_when: false
      failed_when: false

    - name: Fail early when the token secret is missing
      ansible.builtin.fail:
        msg: >-
          Could not read secret "{{ secret_id_github }}" from Secrets Manager.
          Populate it first using playbooks/1.manage-secrets.yml.
      when: gh_secret.rc != 0 or (gh_secret.stdout | default('') | trim | length) == 0

    - name: Bind the token for this run
      ansible.builtin.set_fact:
        github_token: "{{ gh_secret.stdout | trim }}"
      no_log: true

    # ── Bootstrap: state bucket, outside OpenTofu ────────────────────────────────
    - name: Bootstrap the OpenTofu state bucket
      ansible.builtin.shell: |
        set -e
        if [ "{{ is_local }}" = "true" ]; then EP="--endpoint-url {{ aws_endpoint }}"; else EP=""; fi
        if aws s3api head-bucket --bucket {{ state_bucket }} $EP >/dev/null 2>&1; then
          echo "exists"
        else
          # us-east-1 does not accept LocationConstraint
          if [ "{{ aws_region }}" = "us-east-1" ]; then
            aws s3api create-bucket --bucket {{ state_bucket }} $EP >/dev/null
          else
            aws s3api create-bucket --bucket {{ state_bucket }} \
              --create-bucket-configuration LocationConstraint={{ aws_region }} $EP >/dev/null
          fi
          echo "created"
        fi
        # Hardening — idempotent
        aws s3api put-public-access-block --bucket {{ state_bucket }} $EP \
          --public-access-block-configuration \
          BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
        aws s3api put-bucket-encryption --bucket {{ state_bucket }} $EP \
          --server-side-encryption-configuration \
          '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'
        aws s3api put-bucket-versioning --bucket {{ state_bucket }} $EP \
          --versioning-configuration Status=Enabled
      register: state_bucket_bootstrap
      changed_when: "'created' in state_bucket_bootstrap.stdout"

    # State lock table bootstrap
    - name: Create the OpenTofu state lock table (first-time bootstrap)
      ansible.builtin.shell: |
        set -e
        if [ "{{ is_local }}" = "true" ]; then EP="--endpoint-url {{ aws_endpoint }}"; else EP=""; fi
        if aws dynamodb describe-table --table-name {{ state_lock_table }} $EP >/dev/null 2>&1; then
          echo "exists"
        else
          aws dynamodb create-table --table-name {{ state_lock_table }} \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST $EP >/dev/null
          aws dynamodb wait table-exists --table-name {{ state_lock_table }} $EP
          echo "created"
        fi
      register: lock_table
      changed_when: "'created' in lock_table.stdout"

    # ── Clone repo and run OpenTofu ──
    - name: Clean working directory
      ansible.builtin.file:
        path: "/tmp/learn-opensible"
        state: absent

    - name: Clone source code from GitHub
      ansible.builtin.git:
        repo: "https://{{ github_token }}@{{ github_repo }}"
        dest: "/tmp/learn-opensible"
        version: "main"
        force: true
      no_log: true

    - name: Construct Tofu Init Backend Configs
      ansible.builtin.set_fact:
        backend_args: >-
          -backend-config="access_key={{ aws_access_key }}"
          -backend-config="secret_key={{ aws_secret_key }}"
          -backend-config="dynamodb_table={{ state_lock_table }}"
          {% if is_local == "true" %}
          -backend-config="endpoint={{ aws_endpoint }}"
          -backend-config="use_path_style=true"
          -backend-config="skip_credentials_validation=true"
          -backend-config="skip_metadata_api_check=true"
          -backend-config="skip_requesting_account_id=true"
          {% endif %}

    - name: Run OpenTofu Init
      ansible.builtin.shell: tofu init -reconfigure -input=false {{ backend_args }}
      args:
        chdir: "{{ iac_dir }}"

    - name: Run OpenTofu Plan
      ansible.builtin.shell: tofu plan -input=false -var="aws_endpoint={{ aws_endpoint if is_local == 'true' else '' }}" -var="is_local={{ is_local }}"
      args:
        chdir: "{{ iac_dir }}"

    - name: Run OpenTofu Apply
      ansible.builtin.shell: tofu apply -auto-approve -input=false -var="aws_endpoint={{ aws_endpoint if is_local == 'true' else '' }}" -var="is_local={{ is_local }}"
      args:
        chdir: "{{ iac_dir }}"
      register: apply_result

    - name: Show Apply Output
      ansible.builtin.debug:
        var: apply_result.stdout_lines

    - name: Generate Kubeconfig (Local/AWS)
      ansible.builtin.shell: |
        if [ "{{ is_local }}" = "true" ]; then
          aws eks update-kubeconfig --name learn-opensible-dev --endpoint-url {{ aws_endpoint }} --kubeconfig /root/.kube/config
          # FIX: Bypass TLS verification and map to localstack container directly
          /usr/local/bin/kubectl config set-cluster arn:aws:eks:us-east-1:000000000000:cluster/learn-opensible-dev --server=https://localstack:4510 --insecure-skip-tls-verify=true --kubeconfig /root/.kube/config
          /usr/local/bin/kubectl config unset clusters.arn:aws:eks:us-east-1:000000000000:cluster/learn-opensible-dev.certificate-authority-data --kubeconfig /root/.kube/config || true
        else
          aws eks update-kubeconfig --name learn-opensible-dev --kubeconfig /root/.kube/config
        fi

    # Wait for nodes to be Ready in both local and real AWS environments.
    - name: Wait for EKS Node to be Ready
      ansible.builtin.shell: /usr/local/bin/kubectl wait --for=condition=Ready nodes --all --timeout=300s --kubeconfig /root/.kube/config

    - name: Get IP of EKS Node (Local only)
      ansible.builtin.shell: "/usr/local/bin/kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type==\"InternalIP\")].address}' --kubeconfig /root/.kube/config"
      register: k3s_ip_result
      ignore_errors: true
      when: is_local == "true"

    - name: Get ALB Target Group ARN
      ansible.builtin.shell: tofu output -raw alb_tg_arn
      args:
        chdir: "{{ iac_dir }}"
      register: alb_tg_arn_result
      when: is_local == "true"

    - name: Register EKS Node to ALB Target Group (Local only)
      ansible.builtin.shell: |
        aws elbv2 register-targets --target-group-arn {{ alb_tg_arn_result.stdout }} --targets Id={{ k3s_ip_result.stdout }},Port=30080 --endpoint-url {{ aws_endpoint }}
      when: is_local == "true" and k3s_ip_result.stdout != "" and alb_tg_arn_result.stdout != ""
